<div class="flex w-full gap-6 min-h-100">
  <div class="flex gap-4 w-2/3">
    <label 
      for="dropzone-file"
      class="flex flex-col items-center justify-center w-full h-full min-h-64 p-6 border-2 border-grey-3 border-dashed rounded cursor-pointer"
    >
      <p class="mb-2 text-lg">
        Click here to upload or drag and drop
      </p>
      <input type="file" id="dropzone-file" class="hidden">
    </label>
  </div>
  <div class="flex flex-col w-1/3 gap-3">
    <div class="flex justify-center border-2 border-grey-3 rounded">
      <img 
        src="/user.png" 
        alt="image preview"
        class="w-full aspect-square object-cover rounded"
      >
    </div>
    <div class="flex w-full gap-3">
      <button class="dark-button flex-1">
        Cancel
      </button>
      <button class="btn light-button flex-1">
        Upload
      </button>
    </div>
  </div>
</div>
