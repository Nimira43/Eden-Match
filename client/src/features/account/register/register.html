<div class="card bg-light w-1/2 mx-auto flex flex-col p-6 rounded shadow-lg">
  <div class="card-title justify-center text-3xl text-dark font-medium uppercase">
    Register
  </div>
  <div class="card-body w-full">
    <form 
      [formGroup]="registerForm"
      class="flex flex-col gap-4 w-full"
      (ngSubmit)="register()"
    >
      <input 
        class="input input-field focus:border-dark"
        formControlName="email"
        placeholder="Email"
      />
      <input 
        class="input input-field focus:border-dark"
        formControlName="displayName"
        placeholder="Display name"
      />
      <input
        type="password" 
        class="input input-field focus:border-dark"
        formControlName="password"
        placeholder="Password"
      />
      <input
        type="password" 
        class="input input-field focus:border-dark"
        formControlName="confirmPassword"
        placeholder="Confirm password"
      />    
      <div class="flex items-center justify-end gap-3">
        <button 
          (click)="cancel()"
          type="button"
          class="btn light-button"
        >
          Cancel
        </button>
        <button 
        [disabled]="!registerForm.valid"
          type="submit"
          class="btn dark-button"
        >
          Register
        </button>
      </div>
    </form>
  </div>
  <div class="flex flex-col w-full px-3 mockup-code text-xs">
    <div>Form value: {{registerForm.value | json}}</div>
    <div>Form status: {{registerForm.status | json}}</div>
  </div>
</div>
