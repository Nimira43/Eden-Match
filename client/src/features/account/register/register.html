<div class="card bg-light w-1/2 mx-auto flex flex-col p-6 rounded shadow-lg mt-10">
  <div class="card-title justify-center text-3xl text-main-dark font-medium uppercase">
    Register
  </div>
  <div class="card-body w-full">
    <ul class="steps">
      <li class="step step-neutral text-main-dark text-sm">
        Credentials
      </li>
      <li 
        class="step text-main-dark text-sm" 
        [class.step-neutral]="currentStep() === 2"
      >
        Profile
      </li>
    </ul>    
    @if (currentStep() === 1) {
      <form 
        [formGroup]="credentialsForm"
        class="flex flex-col gap-3 w-full steps"
      >      
        <app-text-input 
          class="mt-5"
          label="Email"
          formControlName="email"
        />
        <app-text-input 
          label="Display Name"
          formControlName="displayName"
        />    
        <app-text-input 
          label="Password"
          formControlName="password"
          type="password"
        />    
        <app-text-input 
          label="Confirm Password"
          formControlName="confirmPassword"
          type="password"
        />    
        <div class="flex items-center justify-end gap-3">
          <button 
            (click)="cancel()"
            type="button"
            class="btn light-button"
          >
            Cancel
          </button>
          <button 
            [disabled]="!credentialsForm.valid"
            (click)="nextStep()"
            type="button"
            class="btn dark-button"
          >
            Next
          </button>
        </div>
      </form>
    }
    @if (currentStep() === 2) {
      <form
        [formGroup]="profileForm"
        class="flex flex-col w-full gap-4 steps"
      >
        <div class="flex items-center justify-center gap-4 text-lg mt-5">
          <div> Gender: </div>
          <label class="flex gap-3 items-center">
            <span>Male</span>
            <input 
              type="radio"
              formControlName="gender"
              value="male"
              class="radio radio-neutral"
            >
          </label>
          <label class="flex gap-3 items-center">
            <span>Female</span>
            <input 
              type="radio"
              formControlName="gender"
              value="female"
              class="radio "
            >
          </label>
        </div>
        <app-text-input 
          [maxDate]="getMaxDate()"
          type="date"
          label="Date of Birth"
          formControlName="dateOfBirth"
        />
        <app-text-input 
          label="City"
          formControlName="city"
        />
        <app-text-input 
          label="Country"
          formControlName="country"
        />
        <div class="flex items-center justify-end gap-3">
          <button 
            (click)="prevStep()"
            type="button"
            class="btn light-button"
          >
            Back
          </button>
          <button 
            [disabled]="!profileForm.valid"
            (click)="register()"
            type="button"
            class="btn dark-button"
          >
            Register
          </button>
        </div>
      </form>
    }
  </div>

  @if (validationErrors().length > 0) {
    <div class="mt-5 flex bg-main-light rounded w-1/2 p-3 mx-auto">
      <ul class="flex flex-col text-main-dark space-y-1">
        @for (error of validationErrors(); track $index) {
          <li>{{error}}</li>
        }
      </ul>
    </div>
  }
</div>
