<div class="card bg-light w-1/2 mx-auto flex flex-col p-6 rounded shadow-lg mt-10">
  <div class="card-title justify-center text-3xl text-dark font-medium uppercase">
    Register
  </div>
  <div class="card-body w-full">
    <ul class="steps">
      <li class="step step-neutral">
        Credentials
      </li>
      <li 
        class="step" 
        [class.step-neutral]="currentStep() === 2"
      >
        Profile
      </li>
    </ul>    
    @if (currentStep() === 1) {
      <form 
        [formGroup]="credentialsForm"
        class="flex flex-col gap-3 w-full steps"
      >      
        <app-text-input 
          label="Email"
          formControlName="email"
        />
        <app-text-input 
          label="Display Name"
          formControlName="displayName"
        />    
        <app-text-input 
          label="Password"
          formControlName="password"
          type="password"
        />    
        <app-text-input 
          label="Confirm Password"
          formControlName="confirmPassword"
          type="password"
        />    
        <div class="flex items-center justify-end gap-3">
          <button 
            (click)="cancel()"
            type="button"
            class="btn light-button"
          >
            Cancel
          </button>
          <button 
            [disabled]="!credentialsForm.valid"
            (click)="nextStep()"
            type="button"
            class="btn dark-button"
          >
            Next
          </button>
        </div>
      </form>
    }
    @if (currentStep() === 2) {
      <form
        [formGroup]="profileForm"
        class="flex flex-col w-full gap-4 steps"
      >
        <div>Profile Form</div>
        <div class="flex items-center justify-end gap-3">
          <button 
            (click)="prevStep()"
            type="button"
            class="btn light-button"
          >
            Back
          </button>
          <button 
            [disabled]="!profileForm.valid"
            (click)="register()"
            type="button"
            class="btn dark-button"
          >
            Register
          </button>
        </div>
      </form>
    }
  </div>
  <!-- <div class="flex flex-col items-start w-full px-3 mockup-code text-xs">
    <div>Creds value: {{credentialsForm.value | json}}</div>
    <div>Creds status: {{credentialsForm.value | json}}</div>
    <div>Profile value: {{profileForm.status | json}}</div>
    <div>Profile status: {{profileForm.status | json}}</div>
  </div> -->
</div>
