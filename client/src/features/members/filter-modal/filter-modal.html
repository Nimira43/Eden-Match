<dialog 
  #filterModal
  class="modal"
>
  <div class="modal-box">
    <h3 class="text-lg font-medium">
      Modal
    </h3>
    <p class="py-4">
      Lorem ipsum dolor sit amet consectetur.
    </p>
    <div class="modal-action">        
      <button 
        (click)="submit()"
        class="btn dark-button"
      >
        Submit
      </button>
    </div>
  </div>
  <form
    method="dialog"
    class="modal-backdrop"
  >
    <button (click)="close()">
      Close
    </button>
  </form>
</dialog>
