<dialog 
  #filterModal
  class="modal"
>
  <div class="modal-box max-w-lg">
    <h3 class="text-lg font-medium">
      Select Filters
    </h3>
    <div class="flex justify-between w-full items-center mt-6">
      <div class="flex flex-col w-full gap-6">
        <div class="flex justify-between items-center">
          <span class="font-medium">
            Select Gender:
          </span>
          <div class="flex gap-2">
            @if (memberParams().gender) {
              <button
                type="button"
                class="btn special-button"
                (click)="memberParams().gender = ''"
              >
                ✕
              </button>
            }
            @for (g of genders; track g.value) {
              @if (!memberParams().gender || memberParams().gender === g.value) {
                <input
                  type="radio"
                  class="btn special-button"
                  name="gender"
                  [value]="g.value"
                  [attr.aria-label]="g.label"
                  [(ngModel)]="memberParams().gender"
                >
              }
            }
          </div>
        </div>
        <label class="flex justify-between items-center">
          <span class="font-medium">
            Select Age
          </span>
          <div class="flex gap-3">
            <input 
              type="number"
              class="input w-20"
              [min]="18"
              [(ngModel)]="memberParams().minAge"
              name="minAge"
              (change)="onMinAgeChange()"
            >
            <input 
              type="number"
              class="input w-20"
              [min]="memberParams().minAge || 18"
              [(ngModel)]="memberParams().maxAge"
              name="maxAge"
              (change)="onMaxAgeChange()"
            >
          </div>
        </label>
        <label class="flex justify-between items-center">
          <span class="font-medium">
            Order By: 
          </span>
          <select 
            name="orderBy" 
            class="select"
            [(ngModel)]="memberParams().orderBy"
          >
            <option
              disabled
              selected
            >
              Order By:
            </option>
            <option value="created">Newest Members</option>
            <option value="lastActive">Last Active</option>
          </select>
        </label>
      </div>
    </div>

    <div class="modal-action">        
      <button 
        (click)="submit()"
        class="btn dark-button"
      >
        Submit
      </button>
    </div>
  </div>
  <form
    method="dialog"
    class="modal-backdrop"
  >
    <button (click)="close()">
      Close
    </button>
  </form>
</dialog>
